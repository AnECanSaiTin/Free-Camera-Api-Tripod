license="${mod_license}"

[[mods]]

modId="${addon_id}"
version="${addon_version}"
displayName="${addon_name}"
authors="${mod_authors}"
description='''Modern UI based editor screens for Free Camera API Tripod.'''

[[dependencies.${addon_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${addon_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 主 mod：本附属 mod 只是它的界面外壳，因此是必需依赖
[[dependencies.${addon_id}]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="CLIENT"

# Modern UI：界面框架本身
[[dependencies.${addon_id}]]
    modId="modernui"
    type="required"
    versionRange="[${modern_ui_version},)"
    ordering="AFTER"
    side="CLIENT"
