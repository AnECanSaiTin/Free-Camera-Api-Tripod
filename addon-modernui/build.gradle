plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = 'neo-' + minecraft_version + '-' + addon_version
group = mod_group_id

base {
    archivesName = addon_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 主 mod 的构建产物：编译期要看到它的类，本地联调时也要把它加载进游戏。
// 用项目相对路径而不是跨项目对象引用，配置缓存下更稳。
def mainModJar = project.file("../build/libs/${mod_id}-neo-${minecraft_version}-${mod_version}.jar")

repositories {
    mavenLocal()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        // 只保留客户端：附属 mod 的效果只能在客户端看到，加载时会把主 mod 一起拉进来
        client {
            client()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 本项目的源码属于附属 mod，与主 mod 各自独立
        "${addon_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 主 mod：编译期看 jar，运行期也加载它（localRuntime 不会传递给下游）
    compileOnly files(mainModJar)
    localRuntime files(mainModJar)

    // 主 mod 的必需依赖：它的 localRuntime 不会传给下游，所以这里要自己拉齐整条依赖链，
    // 否则主 mod 在附属 mod 的运行环境里会因缺少前置而拒绝加载。
    localRuntime fileTree("../libs") { include "free_camera_api-*.jar" }

    // Modern UI：本附属 mod 存在的意义就是用它渲染编辑器，因此是必需依赖
    compileOnly "maven.modrinth:modern-ui:${modern_ui_version}"
    localRuntime "maven.modrinth:modern-ui:${modern_ui_version}"
}

// 先把主 mod 打包出来，否则上面的 jar 依赖不存在
tasks.named('compileJava') {
    dependsOn ':jar'
}

// 展开模板里的占位符，生成 neoforge.mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_id                 : mod_id,
            mod_version            : mod_version,
            addon_id               : addon_id,
            addon_name             : addon_name,
            addon_version          : addon_version,
            modern_ui_version      : modern_ui_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
